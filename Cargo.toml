[package]
name = "coldbench"
description = "Bitcoin wallet for hardware signers: Jade, Coldcard and Trezor, in the bench suite look"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/v0l/coldbench"

[workspace]
members = [".", "crates/hww"]

[dependencies]
hww = { path = "crates/hww" }
bdk_wallet = "3.2"
esplora-client = { version = "0.12", default-features = false }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.35"
egui_bench = "0.5.4"
egui-qr = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minreq = { version = "2.14", features = ["https-rustls"] }

[dev-dependencies]
bdk_esplora = { version = "0.22", features = ["blocking-https-rustls"] }
bdk_wallet = { version = "3.2", features = ["std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
