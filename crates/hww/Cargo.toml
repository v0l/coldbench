[package]
name = "hww"
description = "One blocking interface over the Jade, Coldcard and Trezor hardware wallets"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]
bitcoin = { version = "0.32", features = ["base64", "rand-std", "serde", "secp-recovery"] }
ciborium = "0.2"
coldcard = "0.13"
minreq = { version = "3.0", features = ["https-rustls", "json-using-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
protobuf = "=3.7.2"
trezor-client = { version = "0.1.6", default-features = false, features = ["bitcoin"] }
